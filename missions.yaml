# ELF Standard Missions Configuration
# Replaces test-swarm.yaml with ELF-compliant mission definitions

missions:
  # === Standard ELF Missions ===
  
  code-review:
    name: "Code Review Mission"
    description: "Comprehensive code review for quality, security, and design"
    priority: "normal"
    workflow: "sequential"
    agents:
      - name: "skeptic"
        role: "primary_reviewer"
        task: |
          You are conducting a code review. Focus on:
          1. Security vulnerabilities and potential attack vectors
          2. Edge cases and error handling
          3. Performance bottlenecks
          4. Logic errors and bugs
          5. Code style and maintainability
          
          Provide specific, actionable feedback with line numbers when possible.
        model: "sonnet"
        timeout: 300
      
      - name: "architect"
        role: "design_reviewer"
        task: |
          You are reviewing the architectural aspects of this code change:
          1. Design patterns and their appropriate use
          2. System integration points
          3. Scalability considerations
          4. Impact on existing architecture
          5. SOLID principles adherence
          
          Evaluate if the design is sound and suggest improvements.
        model: "sonnet"
        timeout: 300
    
    coordination:
      protocol: "blackboard"
      heartbeat_interval: 30
      max_duration: 600
    
    deliverables:
      - review_report.md
      - security_findings.md
      - design_assessment.md

  new-feature:
    name: "New Feature Development Mission"
    description: "Design and implement a new feature from requirements"
    priority: "normal"
    workflow: "sequential"
    agents:
      - name: "researcher"
        role: "requirements_analyst"
        task: |
          Analyze the requirements and gather necessary context:
          1. Parse user requirements into technical specs
          2. Research existing codebase for integration points
          3. Identify dependencies and constraints
          4. Document acceptance criteria
          5. Create implementation plan outline
        model: "sonnet"
        timeout: 300
      
      - name: "architect"
        role: "system_designer"
        task: |
          Design the system architecture for the new feature:
          1. Create high-level design document
          2. Define interfaces and APIs
          3. Plan data structures and schemas
          4. Consider error handling and edge cases
          5. Document design decisions
        model: "opus"
        timeout: 400
      
      - name: "creative"
        role: "solution_designer"
        task: |
          Generate creative implementation approaches:
          1. Propose multiple implementation strategies
          2. Evaluate trade-offs for each approach
          3. Suggest innovative solutions or optimizations
          4. Identify potential risks and mitigations
          5. Recommend the best approach with reasoning
        model: "sonnet"
        timeout: 300
      
      - name: "skeptic"
        role: "validation_specialist"
        task: |
          Validate the proposed solution:
          1. Review requirements coverage
          2. Test for edge cases and failure modes
          3. Validate security considerations
          4. Check performance implications
          5. Verify maintainability and testability
        model: "haiku"
        timeout: 200
    
    coordination:
      protocol: "blackboard"
      heartbeat_interval: 30
      max_duration: 1200
    
    deliverables:
      - requirements_spec.md
      - design_document.md
      - implementation_plan.md
      - validation_report.md

  bug-hunt:
    name: "Bug Investigation Mission"
    description: "Investigate and fix reported bugs or unexpected behavior"
    priority: "high"
    workflow: "iterative"
    agents:
      - name: "researcher"
        role: "investigator"
        task: |
          Investigate the bug systematically:
          1. Reproduce the issue with minimal steps
          2. Analyze error logs and stack traces
          3. Identify the root cause through debugging
          4. Research similar issues in the codebase
          5. Document findings and impact assessment
        model: "sonnet"
        timeout: 400
      
      - name: "skeptic"
        role: "fix_validator"
        task: |
          Validate the proposed fix:
          1. Test the fix against the original issue
          2. Check for regressions in related functionality
          3. Verify edge cases are properly handled
          4. Test under different conditions (load, data size, etc.)
          5. Ensure the fix follows best practices
        model: "haiku"
        timeout: 300
    
    coordination:
      protocol: "blackboard"
      heartbeat_interval: 30
      max_duration: 900
    
    deliverables:
      - bug_report.md
      - root_cause_analysis.md
      - fix_implementation.md
      - validation_results.md

  # === Specialized Missions ===
  
  system-health-check:
    name: "System Health Monitoring Mission"
    description: "Comprehensive health check of ELF system components"
    priority: "low"
    workflow: "parallel"
    agents:
      - name: "health_monitor"
        role: "component_checker"
        task: |
          Check health of assigned ELF components:
          1. Verify database connectivity and performance
          2. Check coordination system status
          3. Validate event chronicle functionality
          4. Monitor system resource usage
          5. Report any anomalies or performance issues
        model: "haiku"
        timeout: 120
        parallel_instances: 3
    
    coordination:
      protocol: "blackboard"
      heartbeat_interval: 15
      max_duration: 300
    
    deliverables:
      - health_report.json
      - performance_metrics.json
      - recommendations.md

  standards-audit:
    name: "ELF Standards Compliance Audit Mission"
    description: "Audit ELF components for standards compliance"
    priority: "normal"
    workflow: "sequential"
    agents:
      - name: "compliance_auditor"
        role: "standards_checker"
        task: |
          Audit ELF components for standards compliance:
          1. Review database schema compliance
          2. Check coordination protocol adherence
          3. Validate logging and event systems
          4. Review configuration standardization
          5. Identify gaps and non-compliant implementations
          6. Create detailed compliance report with migration plan
        model: "sonnet"
        timeout: 600
    
    coordination:
      protocol: "blackboard"
      heartbeat_interval: 30
      max_duration: 900
    
    deliverables:
      - compliance_audit_report.md
      - migration_plan.md
      - compliance_gaps.md

# Mission Templates (for creating custom missions)
templates:
  custom_sequential:
    workflow: "sequential"
    coordination:
      protocol: "blackboard"
      heartbeat_interval: 30
      max_duration: 600
    deliverables: []
  
  custom_parallel:
    workflow: "parallel"
    coordination:
      protocol: "blackboard"
      heartbeat_interval: 15
      max_duration: 300
    deliverables: []
  
  custom_iterative:
    workflow: "iterative"
    coordination:
      protocol: "blackboard"
      heartbeat_interval: 30
      max_duration: 900
    deliverables: []

# Mission Execution Settings
execution:
  default_model: "sonnet"
  timeout_default: 300
  max_concurrent_missions: 5
  retry_attempts: 3
  retry_delay: 60
  
  # Resource limits per mission
  resources:
    max_memory_mb: 2048
    max_cpu_percent: 80
    max_disk_io_mb: 100
  
  # Monitoring and logging
  monitoring:
    real_time_updates: true
    log_events: true
    save_state: true
    create_snapshots: true

# Integration Points
integrations:
  query_system:
    enabled: true
    context_builder: true
    knowledge_base: true
  
  event_chronicle:
    enabled: true
    log_mission_events: true
    create_audit_trail: true
  
  dashboard:
    enabled: true
    real_time_status: true
    mission_visualization: true
  
  git:
    auto_commit_missions: false
    create_branches: true
    track_changes: true