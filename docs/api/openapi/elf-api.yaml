              type: object
              properties:
                name:
                  type: string
                  description: Agent name
                status:
                  type: string
                  description: Agent status
              required:
                - name
                - status
            orchestrator:
              type: object
              properties:
                name:
                  type: string
                  description: Agent name
                status:
                  type: string
                  description: Agent status
              required:
                - name
                - status
            ceo:
              type: object
              properties:
                name:
                  type: string
                  description: Agent name
                status:
                  type: string
                  description: Agent status
              required:
                - name
                - status
          required:
            - sentinel
