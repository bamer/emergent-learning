            - name
            - port
            - status
        learning_processor:
          type: object
          properties:
            name:
              type: string
              description: Component name
            status:
              type: string
              description: Component status
            functions:
              type: array
              items:
                type: string
              description: Available functions
          required:
            - name
            - status
            - functions
        agents:
          type: object
          properties:
